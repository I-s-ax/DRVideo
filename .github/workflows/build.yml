name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar SDK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          JAR=$(ls -d "$ANDROID_HOME"/platforms/android-*/android.jar | sort -V | tail -1)
          echo "BT=$BT" >> "$GITHUB_ENV"
          echo "JAR=$JAR" >> "$GITHUB_ENV"
          echo "build-tools: $BT"; echo "android.jar: $JAR"

      - name: Compilar
        run: |
          mkdir -p build/classes
          "$BT/aapt" package -f -M AndroidManifest.xml -S res -I "$JAR" -F build/base.apk
          javac --release 8 -classpath "$JAR" -d build/classes $(find src -name '*.java')
          "$BT/d8" --min-api 21 --lib "$JAR" --output build $(find build/classes -name '*.class')
          (cd build && zip -q -j base.apk classes.dex)
          "$BT/zipalign" -f 4 build/base.apk build/aligned.apk

      - name: Firmar
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
          else
            echo "::warning::Sin secreto KEYSTORE_B64: se usa una llave temporal (no podrás actualizar encima de la versión anterior)."
            keytool -genkeypair -keystore release.keystore -storepass android -keypass android \
              -alias debug -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Isa"
          fi
          "$BT/apksigner" sign --ks release.keystore --ks-pass pass:android --key-pass pass:android \
            --out build/TikTokDL.apk build/aligned.apk
          "$BT/apksigner" verify build/TikTokDL.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TikTokDL
          path: build/TikTokDL.apk

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: TikTok DL v1.0.${{ github.run_number }}
          files: build/TikTokDL.apk
